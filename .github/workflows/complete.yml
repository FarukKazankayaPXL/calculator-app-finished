name: Build Example

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: NPM framework
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Create ZIP
        run: zip -r app.zip . -x ".git/*" "app.zip"

      - name: Verification
        run: ls -alh app.zip

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: app.zip
        
      - name: Run tests with report
        run: npx jest --ci --reporters=default --reporters=jest-junit
      
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: junit.xml
