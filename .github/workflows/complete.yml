name: Build Example

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: NPM framework
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Create ZIP
        run: zip -r app.zip . -x ".git/*" "app.zip"

      - name: Verification
        run: ls -alh app.zip

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: app.zip
        
      - run: npm test -- --coverage --reporters=default --reporters=jest-junit
      
      - name: Publish test and coverage repor
        uses: mridang/action-test-reporter@v1
        with:
          name: Unit tests
          coverage-path: coverage/lcov.info
